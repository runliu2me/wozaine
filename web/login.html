<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23d9483b%27/%3E%3C/svg%3E">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" /><meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
<title>我在呢 · 登录</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<form class="card" id="f" method="post" action="/api/login" autocomplete="on">
  <h1>我在呢</h1>
  <p class="sub">爸妈拍一下，就能听到你说「我在呢」。<br>家人的数据只在你自己的服务器上。</p>
  <label for="user">用户名</label>
  <input id="user" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus />
  <label for="password">密码</label>
  <div class="pw-wrap">
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button class="toggle" type="button" id="tog" aria-label="显示密码">显示</button>
  </div>
  <button id="btn" type="submit">登录</button>
  <div class="err" id="err" role="alert" aria-live="polite"></div>
  <p class="foot"><a href="/thanks">站在许多开源项目的肩膀上 · 致敬</a></p>
</form>
<script src="/login.js"></script>
</body>
</html>
